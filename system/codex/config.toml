# Shared Codex policy: the SYSTEM layer, installed by install.sh as /etc/codex/config.toml.
#
# Not stowed into ~/.codex/config.toml, because Codex WRITES that file (project trust,
# hooks.state hashes, [tui] flags) — stowed, every one of those writes dirtied this public repo.
# Codex reads system < user < project, measured on 0.166 via app-server `config/read`:
# tables merge per key, but an ARRAY is replaced whole. So a key defined here must not be
# repeated in a machine's ~/.codex/config.toml, or the local copy silently shadows this one —
# writable_roots above all.
approval_policy = "on-request"
sandbox_mode = "workspace-write"
project_doc_max_bytes = 2000000

[sandbox_workspace_write]
network_access = false
exclude_slash_tmp = true
exclude_tmpdir_env_var = true
writable_roots = ["~/Projects/okf"]

# The okf vault's hooks (scripts/hooks/). Codex runs a hook only once it is
# trusted, at the interactive "Hooks need review" prompt on startup; an untrusted
# one is skipped silently, and a changed one needs review again. The trust hashes
# land in the USER file, keyed by this file's path.
# publish-guard needs --deny: Codex treats "ask" as a failed hook and runs the
# command. Its matcher must stay Bash, since apply_patch text is not a command.
# self-kill-guard always denies (a pkill -f / pgrep -f that matches its own shell).
[[hooks.PreToolUse]]
matcher = "Bash"
hooks = [
  { type = "command", command = "$HOME/Projects/okf/scripts/hooks/publish-guard --deny" },
  { type = "command", command = "$HOME/Projects/okf/scripts/hooks/self-kill-guard" },
]

[[hooks.PreToolUse]]
matcher = "Bash|apply_patch"
hooks = [{ type = "command", command = "$HOME/Projects/okf/scripts/hooks/workspace-brief" }]

[[hooks.Stop]]
hooks = [{ type = "command", command = "$HOME/Projects/okf/scripts/hooks/vault-gate" }]

# newline-restore puts back the trailing newline tools drop when they rewrite tracked files
# (the Stellaris launcher's descriptor.mod, Obsidian's .obsidian/*.json); at session start it
# also names watched files changed for real.
[[hooks.SessionStart]]
hooks = [{ type = "command", command = "$HOME/Projects/okf/scripts/hooks/newline-restore" }]

[[hooks.UserPromptSubmit]]
hooks = [{ type = "command", command = "$HOME/Projects/okf/scripts/hooks/newline-restore" }]

# hyprlock — the fleet's screen locker. PUBLIC repo: nothing machine-specific here.
#
# WHY NOT swaylock (switched 2026-07-30): hyprlock authenticates the fingerprint reader
# ITSELF, over fprintd's D-Bus API (net.reactivated.Fprint), instead of going through PAM.
# It therefore claims the reader and starts verifying the moment the lock appears — you just
# touch the sensor. swaylock cannot do this: its PAM conversation only starts on the first
# keystroke (upstream swaylock#61, an --early-pam flag was proposed and never implemented),
# so the flow there was the awkward "press Enter on an empty field, THEN swipe".
#
# hyprlock is NOT Hyprland-only. It locks via ext-session-lock-v1, which niri implements
# (ext_session_lock_manager_v1 / _surface_v1 are both in the niri binary), and it carries no
# hyprland-specific protocol at all. The hypr* dependencies are plain libraries.
#
# Do NOT pair it with hypridle: niri does not implement hyprland-lock-notify-v1
# (niri-wm/niri#3459). The fleet stays on swayidle — see config-stow/systemd-user/.
#
# ⚠ IF THIS FILE IS MISSING, hyprlock EXITS AND THE SESSION DOES NOT LOCK.
# That is a security failure, not an inconvenience. Keep this package stowed, and re-test
# after editing (`hyprlock` from a terminal, with an SSH session or TTY as the escape hatch)
# BEFORE relying on the swayidle timers.
#
# Reference config: /usr/share/hypr/hyprlock.conf (shipped by the package).
# Password auth uses /etc/pam.d/hyprlock, which the package also ships — nothing to wire up.

$font = Monospace

general {
    hide_cursor = true
    # Don't run the auth stack on an empty submit — with fingerprint enabled, stray Enter
    # presses would otherwise count against the failed-attempt limit.
    ignore_empty_input = true
}

# The whole point of the switch. Verified against libfprint's uru4000 driver and the
# DigitalPersona U.are.U 4500 (05ba:000a); hyprlock also handles PrepareForSleep (releasing
# and reclaiming the device across suspend) and copes with the reader being unplugged, both
# of which matter for an EXTERNAL USB dongle.
auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        present_message = Scanning...
        retry_delay = 250 # ms
    }
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# A solid background rather than the sample's `path = screenshot` + blur: this is the
# component guarding an unlocked session, so it should have as few ways to fail as possible.
# Swap in the screenshot variant per-machine if wanted.
background {
    monitor =
    color = rgba(0, 0, 0, 1.0)
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0)

    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg

    font_color = rgb(143, 143, 143)
    font_family = $font
    fade_on_empty = false
    rounding = 15
    dots_spacing = 0.3

    placeholder_text = Fingerprint or password...
    # $FPRINTFAIL surfaces the fprintd-side failure ("Fingerprint did not match", "device
    # disconnected"), which is otherwise invisible and looks like the reader being ignored.
    fail_text = $PAMFAIL$FPRINTFAIL

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font

    position = -30, 0
    halign = right
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 25
    font_family = $font

    position = -30, -150
    halign = right
    valign = top
}

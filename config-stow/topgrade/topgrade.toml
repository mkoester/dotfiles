# ~/.config/topgrade.toml — one-shot "update everything" umbrella.
# Superset of the `update-os` paru alias: system packages + language toolchains
# + globals paru never sees (pnpm globals, rustup, cargo…).
#   topgrade              # all steps
#   topgrade --dry-run    # print, don't run
#   topgrade only pnpm    # a single step

[misc]
cleanup = false             # topgrade's built-in cleanup is REPLACED by the [commands]
                            # block at the bottom — see the reasoning there.
disable = ["hyprpm"]        # `hyprpm update` needs cmake (not installed) and there are
                            # NO Hyprland plugins on this box (~/.local/share/hyprpm
                            # does not exist), so the step could only ever fail.
                            # Re-enable + `paru -S cmake` if a plugin is ever installed
                            # (hyprland.lua's hyprshell note is the likely trigger).
sudo_loop = true            # keep sudo credentials warm for the whole run (no mid-run
                            # password prompt). Tradeoff: a walk-away Ctrl-C could reuse
                            # the cached sudo session — fine on a personal workstation.
# assume_yes = true         # uncomment for unattended runs

[linux]
arch_package_manager = "paru"   # explicit; otherwise autodetected

# ── the git pulls the retired `sys_upgrade` alias used to do ────────────────
# `sys_upgrade` was `update-os && update-dotfiles && <5 × git -C … pull> && omz update`.
# Everything in it now lives here (2026-08-19):
#   paru -Syu   -> the `system` step (was already covered)
#   omz update  -> the `shell` step, which runs ~/.oh-my-zsh/tools/upgrade.sh
#                  (verified: `topgrade --only shell --dry-run`)
#   the git pulls -> this section, which is why `git_repos` is no longer disabled.
#
# THE `shell` STEP DOES NOT UPDATE ZSH_CUSTOM PLUGINS — this is the whole reason
# the section exists, and nothing says so. `run_oh_my_zsh` (src/steps/zsh.rs at
# v17.9.0) walks $ZSH_CUSTOM collecting plugin/theme repos into a LOCAL `RepoStep`
# that it then drops without ever pulling; only `tools/upgrade.sh` runs, and that
# script contains no reference to custom/plugins/themes at all (grepped, on disk).
# So without the globs below, autosuggestions / syntax-highlighting /
# you-should-use / auto-notify / powerlevel10k would silently stop updating.
#
# `pull_predefined = false` keeps the original objection to this step answered:
# gita-fetch.timer already fetches tracked repos, and topgrade's predefined list
# picks up ~/.zshrc's repo, ~/.vim, ~/.tmux, ~/.config/{fish,i3,sway,openbox,bspwm},
# ~/.doom.d and ~/.dotfiles on its own. With it off, this step pulls EXACTLY the
# paths listed below and nothing else, on every machine.
# Honest measurement (mkDell, 2026-08-19): flipping it to `true` here changes the
# resulting set by NOTHING — none of those paths exist on this box except ~/.zshrc,
# which resolves into ~/src/dotfiles and is listed anyway. So it is insurance for
# the rest of the fleet and for later, not something observably doing work today.
#
# Globs rather than the five explicit paths, matching what the old alias did with
# its `[ -d … ]` guard around auto-notify: the plugin set differs per machine, and
# a newly installed plugin should not need a config edit. Two consequences:
#   * a path that matches nothing prints "did not contain any git repositories"
#     — a warning, not a failure, and the step still runs;
#   * a glob entry that is NOT a repo resolves to its ENCLOSING repo, because
#     get_repo_root runs `git rev-parse --show-toplevel` inside it. oh-my-zsh
#     ships custom/plugins/example and custom/themes/example.zsh-theme, so
#     ~/.oh-my-zsh itself lands in the set and gets pulled here in addition to
#     the `shell` step's upgrade.sh. Redundant, not harmful — the second pull is
#     a no-op; the only cost is that omz's own changelog output may be empty.
#     Narrowing the glob to */.git or */.git/HEAD does NOT avoid it (both tested:
#     rev-parse inside a .git dir fails, so those match nothing at all).
[git]
pull_predefined = false
arguments = "--rebase --autostash"   # --autostash so a dirty dotfiles tree does not fail the step
repos = [
    "~/src/dotfiles",
    "~/.oh-my-zsh/custom/plugins/*",
    "~/.oh-my-zsh/custom/themes/*",
]

[firmware]
upgrade = true              # actually apply fwupd firmware updates (default: only check)

# ── the pnpm gap ────────────────────────────────────────────────────────────
# The built-in `pnpm` step runs `pnpm update -g` (GLOBAL PACKAGES only) and does
# NOT bump the pnpm binary. On this box pnpm is the pacman package, so the
# `system` step (paru) upgrades it — nothing else needed.
# If you ever move pnpm to corepack management, uncomment to self-bump each run:
# "pnpm (corepack self-bump)" = "corepack install --global pnpm@latest"

# ── cleanup, done non-interactively ─────────────────────────────────────────
# `[misc] cleanup = true` adds exactly three commands on this box (measured
# 2026-08-15 by diffing `topgrade --dry-run` with it on and off):
#   paru --pacman pacman -Scc
#   flatpak uninstall --user   --unused
#   flatpak uninstall --system --unused
# The paru one asks FOUR questions every run (pacman: cache / unused repos;
# paru: AUR clones / saved diffs) and there is no way to silence only it —
# `yay_arguments` reaches `-Syu` only, and `assume_yes` would also turn the
# system UPGRADE unattended (both verified by dry-run). So cleanup is off and
# the three commands are reproduced here with their prompts answered.
#
# `--noconfirm` answers each question with its DEFAULT, i.e. exactly what
# hitting ENTER four times does — verified 2026-08-15 against scratch dirs
# (pacman under fakeroot, paru via --pacman + XDG_CACHE_HOME):
#   remove ALL files from cache?      [y/N] -> no   (package cache kept)
#   remove unused repositories?       [Y/n] -> yes
#   clean ALL AUR packages from cache [y/N] -> no   (paru clones kept)
#   remove all saved diffs?           [Y/n] -> yes
# It is NOT "say yes to everything" — don't "fix" this by adding -y anywhere.
#
# ── DMS plugins and their providers ─────────────────────────────────────────
# topgrade has no DMS step. Plugins are git checkouts under
# ~/.config/DankMaterialShell/plugins that `dms plugins update` pulls; the
# attention-badges providers are separate clones in a sibling directory that
# only its own script knows how to fast-forward (--ff-only, so a locally edited
# provider is reported and left alone).
#
# The guards below rely on shell semantics, which topgrade does provide: a
# [commands] value is run as `/usr/bin/zsh -c '<value>'` (verified 2026-08-16 by
# `topgrade --config … --only custom_commands --dry-run`, which prints the exact
# invocation), so `;`, `&&` and `~` expansion all work — including `~` on the
# right-hand side of an assignment, which zsh expands and which the second entry
# depends on.
#
# BOTH ARE GUARDED, because this config is stowed fleet-wide and mkMac2017 runs
# macOS, where neither exists. The guard is `… || exit 0` rather than
# `… && cmd || true`: a missing dms is a silent skip, but a dms that runs and
# FAILS must still fail the step — `|| true` would swallow both alike. The
# provider guard tests the script itself, which also covers a DMS machine that
# simply does not have this plugin installed.
#
# NO `dms restart` HERE, deliberately. An updated plugin is only picked up when
# the shell restarts — DMS sets up its plugin directory watcher at startup —
# but restarting unconditionally would kill and relaunch the bar on every
# topgrade run, and making it conditional needs either a wrapper script diffing
# the plugin checkouts or parsing `dms plugins update` output. So: run
# `dms restart` yourself when the plugin step reports an update. Providers need
# no restart either way, since the daemon reads those files through FileView
# with watchChanges.
[commands]
"cleanup: pacman + AUR cache" = "paru --pacman pacman -Scc --noconfirm"
"cleanup: flatpak unused (user)" = "flatpak uninstall --user --unused -y"
"cleanup: flatpak unused (system)" = "flatpak uninstall --system --unused -y"
"dms: plugin updates" = "command -v dms >/dev/null || exit 0; dms plugins update -a"
"dms: attention-badges providers" = "p=~/.config/DankMaterialShell/plugins/attentionBadges/scripts/providers; test -x $p || exit 0; $p update"

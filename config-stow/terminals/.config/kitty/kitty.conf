# kitty — https://sw.kovidgoyal.net/kitty/conf/
#
# Created 2026-08-10, alongside `paru -S kitty` (0.48.2, cachyos-extra-v3). Installed for two
# behaviours alacritty structurally cannot provide; everything below that line is parity with
# ~/.config/alacritty/alacritty.toml so switching is not also a re-theming.
#
# TRACKED AND STOWED since 2026-08-10, in the `terminals` package alongside the ghostty and
# alacritty configs — one package, because these three are alternatives of the same thing and
# are deliberately kept consistent (same font, same Nord palette, same clipboard keys). Splitting
# them would let a fallback terminal drift into being unusable, which is the opposite of the
# point. Reason for tracking at all is herdr's: an untracked per-machine config has no sync path
# and the failure is silent — a machine simply behaves differently and nothing looks broken.
#
# kitty is the FALLBACK here, not the daily driver (that is ghostty). It stays configured
# because a fallback you have to configure first is not a fallback. It is also the only one of
# the three that can paste on a plain middle-click inside a mouse-grabbing TUI — see
# Workstation-Documentation/desktop/terminal-emulator-comparison.md.
#
# Option names below were read out of kitty/options/definition.py at the version tag, not
# recalled. Apply changes to a running kitty with CTRL+SHIFT+F5 (or restart).

# ── The two behaviours kitty was installed for ────────────────────────────────────

# PLAIN MIDDLE-CLICK PASTES PRIMARY, EVEN INSIDE A TUI.
#
# kitty ships two middle-click maps (definition.py lines 1269 and 1331):
#     paste_selection          middle        release  ungrabbed          paste_from_selection
#     paste_selection_grabbed  shift+middle  release  ungrabbed,grabbed  paste_selection
# "grabbed" means the program running in the terminal has requested mouse events — which herdr
# and most modern TUIs do. So plain middle-click is deliberately inert there and shift+middle
# is the documented way out. That shift-fallback is the SAME mechanism alacritty has
# (`man 5 alacritty`: "the Shift modifier can be used to suppress mouse reporting"), and in
# alacritty it is the ONLY mechanism — its mouse bindings take a `mode` of AppCursor/AppKeypad/
# Search/Alt/Vi, with no notion of mouse capture to match on. kitty exposes it, so:
#
# COST, accepted deliberately: TUIs now never receive a plain middle-click at all. If some app
# turns out to want it, drop `grabbed` here and go back to shift+middle for that case.
mouse_map middle release grabbed,ungrabbed paste_from_selection

# CTRL+C COPIES WHEN THERE IS A SELECTION, OTHERWISE BEHAVES NORMALLY.
#
# Three actions exist (kitty/window.py:2568+); this picks the least surprising:
#     copy_or_noop       copy if selection, else PASS THE KEY THROUGH to the app
#     copy_or_interrupt  copy if selection, else send SIGINT itself
#     copy_and_clear_or_interrupt   as above, and clear the selection
# copy_or_noop is right for a TUI-heavy setup: passing the key through lets the app (or the
# tty) decide what ^C means, where copy_or_interrupt imposes SIGINT. For a plain shell the two
# are indistinguishable — the tty raises SIGINT either way.
#
# Its "only=macos" marking in kitty's source applies to the shipped cmd+c MAPPING, not to the
# action, which is declared unconditionally and is mappable anywhere.
map ctrl+c copy_or_noop

# CTRL+V PASTES — UNCONDITIONALLY, unlike ctrl+c above.
#
# There is deliberately no "smart" form of this and none is possible: the ctrl+c trick works
# because copy reports failure when nothing is selected, whereas paste can always be performed.
# kitty has no `paste_or_noop` to match `copy_or_noop`, and ghostty's `performable:` prefix is
# equally useless here (its Surface.zig has `.paste => {}, // always allowed`). So this key is
# swallowed by the terminal in every application, always.
#
# Accepted cost (MK, 2026-08-10, "I almost never use vim anyway"):
#   vim/neovim  blockwise-visual mode — no alias, genuinely lost
#   zsh/bash    quoted-insert — cheap, CTRL+Q still does it (measured: zsh `bindkey` gives
#               "^V" quoted-insert, and bash reports it on both \C-q and \C-v)
# CTRL+SHIFT+V remains bound to paste as well, so nothing is taken away by adding this.
map ctrl+v paste_from_clipboard

# ── Font ──────────────────────────────────────────────────────────────────────────
#
# MesloLGS Nerd Font across every terminal (MK, 2026-08-10), from `ttf-meslo-nerd` 3.5.0-1.
# S = small line gap; the non-Mono variant is what powerlevel10k (ZSH_THEME in .zshrc) wants,
# as its icons are double-width rather than squeezed into one cell.
#
# USE THE FULL NAME. `MesloLGS NF` — the abbreviation p10k's own docs use — does NOT resolve on
# this system: `fc-match "MesloLGS NF"` returns Noto Sans. A wrong font name never errors, it
# silently renders in the fallback, so verify any change with `fc-match` and check the family
# it echoes back is the one you asked for.
font_family      MesloLGS Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12

# ── Parity with alacritty.toml ────────────────────────────────────────────────────

scrollback_lines   10000
background_opacity 0.8
cursor_shape       underline

# alacritty's selection.save_to_clipboard: selecting also puts the text on CLIPBOARD.
# PRIMARY is populated regardless, so the middle-click map above still works.
copy_on_select clipboard

# alacritty's window.dynamic_padding
window_padding_width 4

# alacritty's [bell] { command = canberra-gtk-play -i message }. enable_audio_bell is off so
# the system sound is not doubled by kitty's own beep.
enable_audio_bell no
command_on_bell   canberra-gtk-play -i message

# ── Colours — Nord, transcribed from alacritty.toml ───────────────────────────────
background #2E3440
foreground #D8DEE9

# normal
color0 #3B4252
color1 #BF616A
color2 #A3BE8C
color3 #EBCB8B
color4 #81A1C1
color5 #B48EAD
color6 #88C0D0
color7 #E5E9F0

# bright  (only black and cyan differ from normal, as in alacritty.toml)
color8  #4C566A
color9  #BF616A
color10 #A3BE8C
color11 #EBCB8B
color12 #81A1C1
color13 #B48EAD
color14 #8FBCBB
color15 #ECEFF4

# Placeholder — this file exists so the glob in ../config MATCHES SOMETHING.
#
# kanshi treats `include <glob>` as a HARD PARSE ERROR when the glob matches no files. It does
# not treat it as an empty include and carry on:
#
#     failed to parse config file
#     Could not parse included config: '/home/mk/.config/kanshi/config.d/*'
#     failed to parse config file
#
# The consequence is total and silent: kanshi EXITS at startup, so no profile is ever applied,
# `kanshictl` reports no running daemon, and the monitor-layout keybinds do nothing — while the
# config looks perfectly fine. Measured on mkDesktop 2026-08-22, where config.d/ held only a
# `.gitkeep`; `*` does not match a dot-prefixed name, so the directory was effectively empty.
# Reproduced with a control: the identical config whose glob matches one real file parses and
# proceeds to connect to the display.
#
# A comments-only file is enough to satisfy the glob — verified, this very file does it.
#
# Real per-machine profiles are symlinked in here by dotfiles/install.sh from
# workstation-private/<host>/kanshi/. They are gitignored: "Make Model Serial" match strings
# are hardware serials and this repo is PUBLIC.

# Outputs are deliberately NOT in left-to-right order: the summary must sort by x position,
# so a reader that keeps config order produces a different (wrong) chain.
#
# Make/model/serial are FICTIONAL. Real ones are hardware identifiers and this repo is public —
# the two CX2701 entries reproduce the property that matters (two identical models telling
# themselves apart only by serial) without naming any actual monitor.
profile docked {
	# right
	output "Contoso CX2701 SN-RIGHT-0003" enable position 6400,0
	# left
	output "Contoso CX2701 SN-LEFT-0001" enable position 0,0
	# centre
	output "Contoso CX4001 SN-MID-0002" enable position 2560,0
	output "Acme Beamer SN-PROJ-0009" disable
}

profile solo {
	output "Contoso CX4001 SN-MID-0002" enable position 2560,0
	output "Contoso CX2701 SN-LEFT-0001" disable
	output "Contoso CX2701 SN-RIGHT-0003" disable
}

# Fixture kanshi config for hypr-monitors' reader.
include ./hypr-monitors-kanshi.d/*

# Same name as one in the include above: kanshi applies the FIRST match, so the included one
# must win and this one must be invisible. A reader that keeps the last would fail here.
profile docked {
	output DP-9 enable position 0,0
}

profile {
	output DP-1 enable position 0,0
}
